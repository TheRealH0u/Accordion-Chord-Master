<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prijava - Accordion Chord Master</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-shell.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <p class="auth-kicker">Accordion Chord Master</p>
            <h1>Prijava</h1>
            <p class="auth-description">Prijavi se in shrani svoje sekvence.</p>
            {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
            <form method="post" class="auth-form">
                <label>Uporabniško ime<input name="username" required autocomplete="username"></label>
                <label>Geslo<input name="password" type="password" required autocomplete="current-password"></label>
                <button class="btn auth-submit" type="submit">Prijava</button>
            </form>
            <p class="auth-switch">Še nimaš računa? <a href="{{ url_for('register') }}">Registracija</a></p>
        </section>
    </main>
</body>
</html>
