<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="{{ url_for('static', filename='img/icon-192x192.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/icon-192x192.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css')}}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <title>Accordion Chord Master</title>
</head>

<body>
    <div id="orientation-warning">
        <h2 style="color: var(--accent-yellow);">Please Rotate Your Device</h2>
        <p>Landscape mode is required for the best accordion experience.</p>
        <div style="font-size: 4rem;">📱🔄</div>
    </div>
    <div class="container">
        <div class="header">
            <a href="https://razgrajaci.eu" target="_blank" class="top-left-logo">
                <img src="{{ url_for('static', filename='img/harmonika.svg') }}" alt="Razgrajaci" />
                <div class="logo-text">
                    <span>Ansambel</span>
                    <span>Razgrajači</span>
                </div>
            </a>
            <h1>Chord Master</h1>
            <form method="POST">
                <select name="uglasitev" onchange="this.form.submit()">
                    {% for u in uglasitve %}
                    <option value="{{u}}" {% if u==selected %}selected{% endif %}>{{u}}</option>
                    {% endfor %}
                </select>
            </form>
        </div>

        <div class="controls">
            <div class="control-item">
                <label class="switch">
                    <input type="checkbox" id="kbToggle" checked>
                    <span class="slider"></span>
                </label>
                <span>Keyboard Controls</span>
            </div>
        </div>

        {% for row in rows %}
        <div class="row">
            <div class="row-label">{{ row.label }}</div>

            <div class="group">
                {% for b in row.major %}
                <div class="chord-unit">
                    <button class="btn-major" id="key-{{b.kb}}"
                        onmousedown="startChord('{{b.name}}', 'major', '{{b.kb}}')" onmouseup="stopChord('{{b.kb}}')"
                        onmouseleave="stopChord('{{b.kb}}')"
                        ontouchstart="event.preventDefault(); startChord('{{b.name}}', 'major', '{{b.kb}}')"
                        ontouchend="event.preventDefault(); stopChord('{{b.kb}}')">
                        <span
                            class="role-tag">{{b.role.replace('Tonika','Tonic').replace('Dominanta','Dom').replace('Subdominanta','Sub')}}</span>
                        {{ b.name }}
                        <span class="kb-hint">{{b.kb.upper()}}</span>
                    </button>
                    <div class="control-item">
                        <label class="switch">
                            <input type="checkbox" id="oct-{{b.kb}}">
                            <span class="slider" style="border-radius: 20px;"></span>
                        </label>
                        <span class="octave-label">High</span>
                    </div>
                </div>
                {% endfor %}
            </div>
            <div class="vertical-line"></div>
            <div class="group">
                {% for b in row.minor %}
                <div class="chord-unit">
                    <button class="btn-minor" id="key-{{b.kb}}"
                        onmousedown="startChord('{{b.name}}', 'minor', '{{b.kb}}')" onmouseup="stopChord('{{b.kb}}')"
                        onmouseleave="stopChord('{{b.kb}}')"
                        ontouchstart="event.preventDefault(); startChord('{{b.name}}', 'minor', '{{b.kb}}')"
                        ontouchend="event.preventDefault(); stopChord('{{b.kb}}')">
                        <span
                            class="role-tag">m-{{b.role.replace('m-Tonika','Tonic').replace('m-Dominanta','Dom').replace('m-Subdominanta','Sub')}}</span>
                        {{ b.name }}
                        <span class="kb-hint">{{b.kb.upper()}}</span>
                    </button>
                    <div class="control-item">
                        <label class="switch">
                            <input type="checkbox" id="oct-{{b.kb}}">
                            <span class="slider" style="border-radius: 20px;"></span>
                        </label>
                        <span class="octave-label">High</span>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>

    <script src="{{ url_for('static', filename='js/piano.js') }}"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('{{ url_for('static', filename='js/sw.js') }}')
                    .then(reg => console.log('Service Worker registriran!', reg))
                    .catch(err => console.log('Napaka pri registraciji!', err));
            });
        }
    </script>
</body>

</html>
