name: Functional browser tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Install Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Run all reviewed functional cases
        run: python -m pytest
      - name: Save reports and browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-results
          path: artifacts/functional/
          if-no-files-found: warn
          retention-days: 14
