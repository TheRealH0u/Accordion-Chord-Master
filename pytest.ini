[pytest]
testpaths = tests/e2e
addopts = -ra --strict-markers --browser chromium --tracing retain-on-failure --screenshot on --full-page-screenshot --output artifacts/functional/browser --junitxml artifacts/functional/junit.xml --html artifacts/functional/report.html --self-contained-html
markers =
    tc_id(value): ID of the reviewed manual test case
junit_suite_name = Accordion Chord Master functional tests
junit_family = xunit2
